<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f4f5f7" id="metaThemeColor">
    <title>Визитка</title>
    <style>
        :root { --bg: #f4f5f7; --text: #1d1d1f; --text-muted: #86868b; --card-bg: #ffffff; --accent: #007aff; --radius: 20px; --border-color: rgba(0, 0, 0, 0.08); --glass-bg: rgba(244, 245, 247, 0.85); --modal-bg: #ffffff; --input-bg: #ffffff; }
        [data-theme="dark"] { --bg: #000000; --text: #f5f5f7; --text-muted: #a1a1a6; --card-bg: #1c1c1e; --border-color: rgba(255, 255, 255, 0.15); --glass-bg: rgba(28, 28, 30, 0.85); --modal-bg: #1c1c1e; --input-bg: #2c2c2e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 100px; -webkit-tap-highlight-color: transparent; transition: 0.3s; }
        body.modal-open { overflow: hidden; touch-action: none; }
        .container { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; background: var(--bg); box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .top-bar { position: absolute; top: 30px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .top-btn { background: var(--card-bg); border: 1px solid var(--border-color); height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text); padding: 0 15px; gap: 8px; }
        .top-btn.icon-only { width: 40px; padding: 0; border-radius: 50%; font-size: 20px; }
        .top-bar-group { display: flex; gap: 10px; }
        .header { padding: 80px 20px 20px; text-align: center; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 4px solid var(--accent); background: #eee; }
        .name { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .role { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .controls { position: sticky; top: 0; background: var(--glass-bg); backdrop-filter: blur(15px); padding: 15px 20px; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .search-box { width: 100%; padding: 12px 20px; border-radius: var(--radius); border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text); font-size: 16px; outline: none; margin-bottom: 15px; }
        .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-muted); font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .services { padding: 20px; display: grid; gap: 15px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border-color); border-left: 5px solid var(--accent); cursor: pointer; }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
        .card-hint { font-size: 13px; color: var(--text-muted); font-weight: 500; display: flex; justify-content: space-between; margin-top: 15px; }
        .footer { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: max-content; background: var(--glass-bg); backdrop-filter: blur(15px); padding: 12px 18px; display: flex; gap: 12px; border-radius: 40px; border: 1px solid var(--border-color); z-index: 100; transition: 0.4s; }
        body.search-focused .footer { transform: translate(-50%, 120px); opacity: 0; pointer-events: none; }
        .action-btn { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; border: none; cursor: pointer; color: #fff; overflow: hidden;}
        .btn-phone { background: linear-gradient(135deg, #34c759, #28a745); } .btn-vk { background: linear-gradient(135deg, #0077FF, #005ce6); } .btn-tg { background: linear-gradient(135deg, #2AABEE, #229ED9); } .btn-wa { background: linear-gradient(135deg, #25D366, #128C7E); } .btn-share { background: linear-gradient(135deg, #AF52DE, #5856D6); } 
        .action-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 999; backdrop-filter: blur(5px); display: flex; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--modal-bg); border-top: 1px solid var(--border-color); width: 100%; max-width: 480px; border-radius: 30px 30px 0 0; padding: 25px 20px 30px; transform: translateY(100%); transition: 0.4s; max-height: 90vh; overflow-y: auto; touch-action: pan-y; }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-swipe-line { width: 40px; height: 5px; background: var(--border-color); border-radius: 3px; margin: 0 auto 15px; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .modal-header h2 { font-size: 22px; margin: 0; color: var(--text); }
        .modal-close-btn { background: var(--bg); border: 1px solid var(--border-color); font-size: 28px; line-height: 1; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; }
        .modal-section { margin-bottom: 15px; background: var(--bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 15px; }
        .modal-section h3 { font-size: 15px; text-transform: uppercase; margin-bottom: 8px; }
        .modal-section p { font-size: 15px; line-height: 1.5; color: var(--text); white-space: pre-wrap; }
        .qr-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; }
        .qr-container img { background: #fff; padding: 15px; border-radius: 20px; width: 250px; height: 250px; border: 1px solid var(--border-color); }
        .confirm-btn-group { display: flex; gap: 15px; margin-top: 20px; }
        .confirm-btn { flex: 1; padding: 14px; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; }
        .btn-cancel { background: var(--bg); color: var(--text); border: 1px solid var(--border-color); }
        .btn-accept { background: var(--accent); color: #fff; }
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; font-weight: 600; color: var(--text-muted); }
        #blockScreen { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 10000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div id="loader"><div>Загрузка...</div></div>
    
    <div id="blockScreen">
        <svg viewBox="0 0 24 24" width="60" height="60" fill="#ff3b30" style="margin-bottom:20px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <h2 style="margin-bottom:10px;">Визитка недоступна</h2>
        <p style="color:var(--text-muted);">Свяжитесь с владельцем.</p>
    </div>

    <div class="container" style="opacity: 0; transition: 0.5s;" id="mainContainer">
        <div class="top-bar">
            <button class="top-btn icon-only" id="themeToggleBtn">🌙</button>
            <div class="top-bar-group">
                <button class="top-btn" id="vcardBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V18z"/></svg> Сохранить</button>
                <button class="top-btn icon-only" id="qrBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v2h-3v-2zm-3 0h2v2h-2v-2zm-2-6h2v8h-2v-8z"/></svg></button>
            </div>
        </div>

        <header class="header">
            <img id="avatarImage" src="https://placehold.co/400x400/eeeeee/999999?text=Фото" class="avatar">
            <h1 class="name" id="nameText">Имя Фамилия</h1>
            <p id="roleText" class="role">Должность / Роль</p>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Поиск услуг...">
            <div class="categories" id="categoriesBox"></div>
        </div>
        <div class="services" id="servicesList"></div>

        <footer class="footer" id="mainFooter"></footer>

        <div class="modal-overlay" id="serviceModalOverlay">
            <div class="modal" id="serviceModal">
                <div class="modal-swipe-line"></div>
                <div class="modal-header"><h2 id="modalTitle">Заголовок</h2><button class="modal-close-btn" onclick="closeModal('serviceModalOverlay', 'serviceModal')">×</button></div>
                <div class="modal-section"><h3 style="color:#007aff;">💼 Мой опыт</h3><p id="modalExp"></p></div>
                <div class="modal-section" id="goodSection"><h3 style="color:#34c759;">🔥 В чем я крут</h3><p id="modalGood"></p></div>
                <div class="modal-section" id="badSection"><h3 style="color:#ff3b30;">⚠️ В чем я плох</h3><p id="modalBad"></p></div>
            </div>
        </div>

        <div class="modal-overlay" id="vcardModalOverlay">
            <div class="modal" id="vcardModal">
                <div class="modal-swipe-line"></div>
                <div class="modal-header"><h2>Сохранение контакта</h2><button class="modal-close-btn" onclick="closeModal('vcardModalOverlay', 'vcardModal')">×</button></div>
                <p style="text-align: center; font-size: 16px; margin-bottom: 10px; color: var(--text);">Добавить <span id="vcardNameText"></span> в контакты?</p>
                <div class="confirm-btn-group">
                    <button class="confirm-btn btn-cancel" onclick="closeModal('vcardModalOverlay', 'vcardModal')">Отмена</button>
                    <button class="confirm-btn btn-accept" onclick="downloadVCard()">Да, сохранить</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="qrModalOverlay">
            <div class="modal" id="qrModal">
                <div class="modal-swipe-line"></div>
                <div class="modal-header"><h2>QR-код</h2><button class="modal-close-btn" onclick="closeModal('qrModalOverlay', 'qrModal')">×</button></div>
                <div class="qr-container"><img id="qrImage" src="" alt="QR"></div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = "{{CLIENT_ID}}";
        let db = {};

        fetch(`../${CLIENT_ID}/data.json?v=` + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                db = data;
                if(db.blocked) {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('blockScreen').style.display = 'flex';
                    return;
                }
                document.getElementById('loader').style.display = 'none';
                document.getElementById('mainContainer').style.opacity = '1';
                document.title = db.name;
                initApp();
            })
            .catch(() => { document.getElementById('loader').innerHTML = 'Визитка не найдена.'; });

        let currentFilter = 'Все';

        function initApp() {
            document.getElementById('nameText').textContent = db.name;
            document.getElementById('vcardNameText').textContent = db.name;
            document.getElementById('roleText').textContent = db.role || 'Должность / Роль';
            document.getElementById('avatarImage').src = db.avatar;

            const footer = document.getElementById('mainFooter');
            footer.innerHTML = '';
            
            if(db.phone) {
                footer.innerHTML += `<a href="tel:+${db.phone}" class="action-btn btn-phone"><svg viewBox="0 0 24 24"><path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1zM19 12h2a9 9 0 0 0-9-9v2c3.9 0 7.1 3.1 7.1 7z"/></svg></a>`;
                footer.innerHTML += `<a href="https://wa.me/${db.phone}" target="_blank" class="action-btn btn-wa"><svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.46 14.1c-.26.74-1.53 1.4-2.12 1.48-.54.07-1.18.15-3.32-.74-2.58-1.07-4.22-3.7-4.35-3.87-.13-.17-1.04-1.38-1.04-2.63 0-1.25.65-1.87.88-2.12.23-.25.5-.31.66-.31h.47c.18 0 .42-.07.64.48.23.56.77 1.88.84 2.03.07.15.11.32.02.5-.09.18-.13.3-.26.45-.13.15-.28.32-.4.45-.13.13-.26.27-.11.53.15.26.66 1.09 1.42 1.76.98.88 1.8 1.15 2.06 1.28.26.13.41.11.56-.06.15-.17.64-.74.82-.99.18-.25.35-.21.58-.12.23.09 1.46.69 1.71.81.25.12.42.18.48.28.06.1.06.58-.2 1.32z"/></svg></a>`;
            }
            if(db.vk) footer.innerHTML += `<a href="https://vk.com/${db.vk}" target="_blank" class="action-btn btn-vk"><svg viewBox="0 0 24 24"><path d="M15.08 2.37A11.75 11.75 0 0 0 12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10c0-1.07-.17-2.1-.48-3.1.28.32.48.74.48 1.1A10 10 0 1 1 12 2a9.9 9.9 0 0 1 3.08.49V2.37z" opacity=".2"/><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12s4.48 10 10 10 10-4.48 10-10zm-6.62 1.48c.17.2.35.4.52.6.48.57 1 1.15 1.5 1.76.12.15.2.3.26.47.04.1-.03.22-.16.22h-1.93c-.47 0-.82-.2-1.1-.55-.38-.47-.78-.93-1.14-1.42-.12-.15-.27-.22-.44-.15-.43.15-.65.48-.65.94v.93c0 .16-.1.25-.26.25h-1.28c-1.6 0-3-.55-4.2-1.6-1.52-1.35-2.6-3.08-3.37-5-.06-.15.02-.25.17-.25h2c.1 0 .17.06.22.16.53 1.43 1.25 2.7 2.3 3.7.15.15.3.18.45.06.18-.16.27-.4.27-.66V9.8c0-.28.16-.4.4-.4h2.18c.23 0 .33.1.33.32v2.58c0 .32.14.47.38.4.15-.05.28-.15.4-.26.4-.45.76-.94 1.1-1.44.13-.18.3-.25.5-.25h1.9c.14 0 .22.06.2.2-.07.2-.18.4-.3.6-.45.6-.9 1.18-1.35 1.76-.23.27-.23.53.03.8z"/></svg></a>`;
            if(db.tg) footer.innerHTML += `<a href="https://t.me/${db.tg}" target="_blank" class="action-btn btn-tg"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.46.93-4.12 2.73-.39.26-.74.39-1.06.38-.35-.01-1.02-.2-1.52-.36-.61-.2-1.1-.3-1.07-.63.02-.17.26-.35.73-.54 2.86-1.24 4.76-2.06 5.71-2.46 2.72-1.14 3.28-1.34 3.65-1.35.08 0 .26.02.37.1.09.07.13.17.15.28 0 .04.01.12 0 .28z"/></svg></a>`;
            
            if(db.customLinks && db.customLinks.length > 0) {
                db.customLinks.forEach(link => {
                    footer.innerHTML += `<a href="${link.url}" target="_blank" class="action-btn" style="background:#fff;"><img src="${link.icon}" style="width:100%; height:100%; object-fit:cover;"></a>`;
                });
            }
            
            footer.innerHTML += `<button class="action-btn btn-share" onclick="shareProfile()"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg></button>`;

            const usedCategories = [...new Set(db.services.map(s => s.category))];
            const catBox = document.getElementById('categoriesBox');
            catBox.innerHTML = '<button class="cat-btn active" data-filter="Все">Все</button>';
            usedCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn'; btn.setAttribute('data-filter', cat); btn.textContent = cat;
                catBox.appendChild(btn);
            });

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active'); currentFilter = btn.getAttribute('data-filter');
                    renderCards(document.getElementById('searchInput').value);
                });
            });
            renderCards();
        }

        function renderCards(query = '') {
            const list = document.getElementById('servicesList');
            list.innerHTML = '';
            const q = query.toLowerCase();
            const filtered = db.services.filter(s => {
                const matchText = s.title.toLowerCase().includes(q) || s.exp.toLowerCase().includes(q);
                return matchText && (currentFilter === 'Все' || s.category === currentFilter);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">Ничего не найдено <br><a href="#" onclick="document.getElementById(\'searchInput\').value=\'\'; document.querySelector(\'.cat-btn[data-filter=\\\'Все\\\']\').click();" style="color:var(--accent); text-decoration:none;">Сбросить поиск</a></p>';
                return;
            }

            filtered.forEach(s => {
                const card = document.createElement('div'); card.className = 'card';
                card.onclick = () => openServiceModal(s);
                card.innerHTML = `<div class="card-title">${s.title}</div><div class="card-hint">Подробнее ➔</div>`;
                list.appendChild(card);
            });
        }

        function openServiceModal(s) {
            document.getElementById('modalTitle').textContent = s.title;
            document.getElementById('modalExp').textContent = s.exp;
            document.getElementById('goodSection').style.display = s.good ? 'block' : 'none';
            document.getElementById('badSection').style.display = s.bad ? 'block' : 'none';
            document.getElementById('modalGood').textContent = s.good;
            document.getElementById('modalBad').textContent = s.bad;
            showModal('serviceModalOverlay', 'serviceModal');
        }

        function showModal(oid, mid) { document.getElementById(oid).classList.add('active'); document.body.classList.add('modal-open'); }
        window.closeModal = function(oid, mid) { document.getElementById(oid).classList.remove('active'); document.body.classList.remove('modal-open'); document.getElementById(mid).style.transform = ''; }
        
        document.querySelectorAll('.modal-overlay').forEach(o => o.onclick = e => { if(e.target === o) closeModal(o.id, o.querySelector('.modal').id) });

        document.querySelectorAll('.modal').forEach(modalEl => {
            let touchStartY = 0;
            modalEl.addEventListener('touchstart', e => { touchStartY = modalEl.scrollTop <= 0 ? e.touches[0].clientY : 0; }, {passive: true});
            modalEl.addEventListener('touchmove', e => {
                if (!touchStartY) return;
                const deltaY = e.touches[0].clientY - touchStartY;
                if (deltaY > 0) modalEl.style.transform = `translateY(${deltaY}px)`;
            }, {passive: true});
            modalEl.addEventListener('touchend', e => {
                if (!touchStartY) return;
                if (e.changedTouches[0].clientY - touchStartY > 100) closeModal(modalEl.parentElement.id, modalEl.id);
                else modalEl.style.transform = '';
            });
        });
        
        document.getElementById('qrBtn').onclick = () => {
            const cleanUrl = window.location.origin + window.location.pathname;
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(cleanUrl)}`;
            showModal('qrModalOverlay', 'qrModal');
        };
        document.getElementById('vcardBtn').onclick = () => { showModal('vcardModalOverlay', 'vcardModal'); };
        window.downloadVCard = function() {
            const [surname, name] = db.name.split(" ");
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nN:${surname || 'Имя'};${name || ''};;\;\nFN:${db.name}\nTEL;TYPE=CELL:+${db.phone}\nURL:https://t.me/${db.tg}\nEND:VCARD`;
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([vcard], { type: "text/vcard" })); a.download = "Contact.vcf"; a.click();
            closeModal('vcardModalOverlay', 'vcardModal');
        };
        const themeBtn = document.getElementById('themeToggleBtn');
        let currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeBtn.onclick = () => { currentTheme = currentTheme === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', currentTheme); localStorage.setItem('theme', currentTheme); };
        document.getElementById('searchInput').addEventListener('input', (e) => renderCards(e.target.value));
        function shareProfile() { navigator.share({ title: db.name, url: window.location.href }); }
    </script>
</body>
</html>
